repos:
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
    - id: black
      language_version: python3 (py3)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.4
    hooks:
    - id: ruff
      args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.0
    hooks:
    - id: mypy
      args: [--strict]
      additional_dependencies: ['numpy', 'sympy', 'matplotlib']

